name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. 拉取代码 ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 配置 JDK ──────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. 赋予 gradlew 执行权限 ─────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 4. 构建 Debug APK ─────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ── 5. 重命名 APK，加上版本号 / commit sha ────────────────────
      - name: Rename APK
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" != v* ]]; then
            VERSION="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          fi
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/NetControl-${VERSION}-debug.apk
          echo "APK_NAME=NetControl-${VERSION}-debug.apk" >> $GITHUB_ENV

      # ── 6. 上传 APK 为 Artifact（每次构建均可下载）────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: app/build/outputs/apk/debug/${{ env.APK_NAME }}
          retention-days: 30

      # ── 7. 打 tag 时自动创建 GitHub Release ───────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "NetControl ${{ github.ref_name }}"
          body: |
            ## NetControl ${{ github.ref_name }}

            ### 下载
            直接下载下方 APK 安装即可（Debug 版本）。

            ### 更新日志
            ${{ github.event.head_commit.message || '见提交说明' }}
          files: app/build/outputs/apk/debug/${{ env.APK_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}