name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. 拉取代码 ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 配置 JDK ──────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. 赋予 gradlew 执行权限 ─────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 4. 从 Secret 还原 keystore 文件 ──────────────────────────
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/release.jks

      # ── 5. 构建 Release APK ───────────────────────────────────────
      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # ── 6. 重命名 APK，加上版本号 / commit sha ────────────────────
      - name: Rename APK
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" != v* ]]; then
            VERSION="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          fi
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/NetControl-${VERSION}.apk
          echo "APK_NAME=NetControl-${VERSION}.apk" >> $GITHUB_ENV

      # ── 7. 上传 APK 为 Artifact（每次构建均可下载）────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: app/build/outputs/apk/release/${{ env.APK_NAME }}
          retention-days: 30

      # ── 8. 打 tag 时自动创建 GitHub Release ───────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "NetControl ${{ github.ref_name }}"
          body: |
            ## NetControl ${{ github.ref_name }}

            ### 下载
            直接下载下方 APK 安装即可。

            ### 更新日志
            ${{ github.event.head_commit.message }}
          files: app/build/outputs/apk/release/${{ env.APK_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
